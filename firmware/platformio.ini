[env:esp32-s3]
; espressif32 6.x = Arduino core 2.0.x
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; N16R8: 16 MB flash + 8 MB octal PSRAM (OLED GIF kareleri PSRAM'de tutulur)
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
; Kart "USB" yazan porta (native USB-Serial/JTAG) takili; Serial bu porttan cikar
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM

lib_deps =
  ncmreynolds/ld2410@^0.1.4
  bblanchon/ArduinoJson@^7.2.1
  olikraus/U8g2@^2.36.2
